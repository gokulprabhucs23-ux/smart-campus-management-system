kind = "web"
previewPath = "/"
title = "Smart Campus Management System"
description = "A role-based campus operations platform for administrators, faculty, staff, and students to manage academic services, attendance, assessments, events, requests, and AI-powered insights."
version = "1.0.0"
id = "artifacts/smart-campus"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21691

[services.development]
run = "pnpm --filter @workspace/smart-campus run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/smart-campus", "run", "build" ]
serve = "static"
publicDir = "artifacts/smart-campus/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21691"
BASE_PATH = "/"
