server:
  port: 8080

spring:
  application:
    name: smart-campus-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/smart_campus}
      auto-index-creation: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

logging:
  level:
    root: INFO
    com.meridian.smartcampus: DEBUG
