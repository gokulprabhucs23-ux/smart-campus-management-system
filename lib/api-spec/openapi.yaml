openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Smart Campus Management System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Role-aware campus summaries
  - name: campus
    description: Campus directory and academic records
  - name: learning
    description: Attendance, marks, assignments, and materials
  - name: community
    description: Announcements, events, and service requests
  - name: ai
    description: Campus assistant and academic insights
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /me:
    get:
      operationId: getMe
      tags: [campus]
      summary: Get the current user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get the current user's dashboard
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /dashboard/analytics:
    get:
      operationId: getDashboardAnalytics
      tags: [dashboard]
      summary: Get campus analytics
      responses:
        "200":
          description: Analytics for the current role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analytics"
  /departments:
    get:
      operationId: listDepartments
      tags: [campus]
      summary: List departments
      responses:
        "200":
          description: Departments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Department"
    post:
      operationId: createDepartment
      tags: [campus]
      summary: Create a department
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentInput"
      responses:
        "201":
          description: Created department
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
  /students:
    get:
      operationId: listStudents
      tags: [campus]
      summary: Search and filter students
      parameters:
        - $ref: "#/components/parameters/Search"
        - name: department
          in: query
          schema:
            type: string
        - name: year
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Students
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Student"
    post:
      operationId: createStudent
      tags: [campus]
      summary: Create a student record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentInput"
      responses:
        "201":
          description: Created student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
  /students/{id}:
    get:
      operationId: getStudent
      tags: [campus]
      summary: Get a student
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
    patch:
      operationId: updateStudent
      tags: [campus]
      summary: Update a student
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentUpdate"
      responses:
        "200":
          description: Updated student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
    delete:
      operationId: deleteStudent
      tags: [campus]
      summary: Delete a student
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Student deleted
  /faculty:
    get:
      operationId: listFaculty
      tags: [campus]
      summary: List faculty
      parameters:
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: Faculty
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Faculty"
    post:
      operationId: createFaculty
      tags: [campus]
      summary: Create faculty
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FacultyInput"
      responses:
        "201":
          description: Created faculty
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Faculty"
  /subjects:
    get:
      operationId: listSubjects
      tags: [campus]
      summary: List subjects
      responses:
        "200":
          description: Subjects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subject"
  /attendance:
    get:
      operationId: listAttendance
      tags: [learning]
      summary: List attendance records for the current role
      parameters:
        - name: studentId
          in: query
          schema:
            type: integer
        - name: subjectId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Attendance summary
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceSummary"
    post:
      operationId: saveAttendance
      tags: [learning]
      summary: Save attendance for a class
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceInput"
      responses:
        "200":
          description: Attendance saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceSummary"
  /marks:
    get:
      operationId: listMarks
      tags: [learning]
      summary: List academic marks
      responses:
        "200":
          description: Marks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Mark"
    post:
      operationId: saveMarks
      tags: [learning]
      summary: Save academic marks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkInput"
      responses:
        "200":
          description: Marks saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mark"
  /assignments:
    get:
      operationId: listAssignments
      tags: [learning]
      summary: List assignments
      responses:
        "200":
          description: Assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Assignment"
    post:
      operationId: createAssignment
      tags: [learning]
      summary: Create an assignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignmentInput"
      responses:
        "201":
          description: Created assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"
  /assignments/{id}/submit:
    post:
      operationId: submitAssignment
      tags: [learning]
      summary: Submit an assignment
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmissionInput"
      responses:
        "201":
          description: Submitted assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"
  /announcements:
    get:
      operationId: listAnnouncements
      tags: [community]
      summary: List announcements
      responses:
        "200":
          description: Announcements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Announcement"
    post:
      operationId: createAnnouncement
      tags: [community]
      summary: Publish an announcement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementInput"
      responses:
        "201":
          description: Published announcement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"
  /events:
    get:
      operationId: listEvents
      tags: [community]
      summary: List campus events
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
    post:
      operationId: createEvent
      tags: [community]
      summary: Create a campus event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "201":
          description: Created event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
  /events/{id}/register:
    post:
      operationId: registerForEvent
      tags: [community]
      summary: Register the current student for an event
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "201":
          description: Registration result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventRegistration"
  /complaints:
    get:
      operationId: listComplaints
      tags: [community]
      summary: List service requests
      responses:
        "200":
          description: Complaints
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Complaint"
    post:
      operationId: createComplaint
      tags: [community]
      summary: Raise a service request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComplaintInput"
      responses:
        "201":
          description: Created complaint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Complaint"
  /complaints/{id}/status:
    patch:
      operationId: updateComplaintStatus
      tags: [community]
      summary: Update a complaint status
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComplaintStatusInput"
      responses:
        "200":
          description: Updated complaint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Complaint"
  /notifications:
    get:
      operationId: listNotifications
      tags: [community]
      summary: List current user notifications
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [community]
      summary: Mark a notification as read
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
  /ai/chat:
    post:
      operationId: chatWithAssistant
      tags: [ai]
      summary: Ask the campus assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatInput"
      responses:
        "200":
          description: Assistant response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
  /ai/insights:
    get:
      operationId: getAcademicInsights
      tags: [ai]
      summary: Get academic recommendations
      responses:
        "200":
          description: Academic insights
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicInsights"
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
    Search:
      name: search
      in: query
      schema:
        type: string
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]
    Me:
      type: object
      required: [id, name, email, role]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        role:
          type: string
          enum: [admin, faculty, student, staff]
        avatar: { type: ["string", "null"] }
    Dashboard:
      type: object
      required: [role, greeting, stats, highlights, activities]
      properties:
        role: { type: string }
        greeting: { type: string }
        stats:
          type: array
          items:
            $ref: "#/components/schemas/Stat"
        highlights:
          type: array
          items:
            $ref: "#/components/schemas/Highlight"
        activities:
          type: array
          items:
            $ref: "#/components/schemas/Activity"
    Stat:
      type: object
      required: [label, value, change, tone]
      properties:
        label: { type: string }
        value: { type: string }
        change: { type: string }
        tone:
          type: string
          enum: [positive, neutral, warning, critical]
    Highlight:
      type: object
      required: [title, detail, meta, tone]
      properties:
        title: { type: string }
        detail: { type: string }
        meta: { type: string }
        tone:
          type: string
          enum: [blue, green, amber, rose, violet]
    Activity:
      type: object
      required: [title, detail, time, type]
      properties:
        title: { type: string }
        detail: { type: string }
        time: { type: string }
        type: { type: string }
    Analytics:
      type: object
      required: [attendanceTrend, departmentStudents, complaints, performance]
      properties:
        attendanceTrend:
          type: array
          items:
            $ref: "#/components/schemas/TrendPoint"
        departmentStudents:
          type: array
          items:
            $ref: "#/components/schemas/DepartmentMetric"
        complaints:
          type: array
          items:
            $ref: "#/components/schemas/StatusMetric"
        performance:
          type: array
          items:
            $ref: "#/components/schemas/DepartmentMetric"
    TrendPoint:
      type: object
      required: [label, value]
      properties:
        label: { type: string }
        value: { type: number }
    DepartmentMetric:
      type: object
      required: [label, value]
      properties:
        label: { type: string }
        value: { type: number }
    StatusMetric:
      type: object
      required: [label, value, color]
      properties:
        label: { type: string }
        value: { type: number }
        color: { type: string }
    Department:
      type: object
      required: [id, name, code, students, faculty]
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string }
        hod: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        students: { type: integer }
        faculty: { type: integer }
    DepartmentInput:
      type: object
      required: [name, code]
      properties:
        name: { type: string, minLength: 2 }
        code: { type: string, minLength: 2 }
        hod: { type: string }
        description: { type: string }
    Student:
      type: object
      required: [id, studentId, name, email, department, course, year, section, status, attendance, average]
      properties:
        id: { type: integer }
        studentId: { type: string }
        name: { type: string }
        email: { type: string }
        phone: { type: ["string", "null"] }
        department: { type: string }
        course: { type: string }
        year: { type: integer }
        section: { type: string }
        status:
          type: string
          enum: [active, inactive]
        attendance: { type: number }
        average: { type: number }
    StudentInput:
      type: object
      required: [studentId, name, email, department, course, year, section]
      properties:
        studentId: { type: string }
        name: { type: string, minLength: 2 }
        email: { type: string, format: email }
        phone: { type: string }
        department: { type: string }
        course: { type: string }
        year: { type: integer }
        section: { type: string }
    StudentUpdate:
      type: object
      properties:
        name: { type: string, minLength: 2 }
        email: { type: string, format: email }
        phone: { type: string }
        department: { type: string }
        year: { type: integer }
        section: { type: string }
        status:
          type: string
          enum: [active, inactive]
    Faculty:
      type: object
      required: [id, facultyId, name, email, department, designation, subjects, status]
      properties:
        id: { type: integer }
        facultyId: { type: string }
        name: { type: string }
        email: { type: string }
        department: { type: string }
        designation: { type: string }
        qualification: { type: string }
        subjects:
          type: array
          items: { type: string }
        status:
          type: string
          enum: [active, inactive]
    FacultyInput:
      type: object
      required: [facultyId, name, email, department, designation]
      properties:
        facultyId: { type: string }
        name: { type: string, minLength: 2 }
        email: { type: string, format: email }
        department: { type: string }
        designation: { type: string }
        qualification: { type: string }
    Subject:
      type: object
      required: [id, code, name, department, semester, credits, faculty]
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        department: { type: string }
        semester: { type: integer }
        credits: { type: integer }
        faculty: { type: string }
    AttendanceSummary:
      type: object
      required: [subjectId, subject, present, total, percentage, status]
      properties:
        subjectId: { type: integer }
        subject: { type: string }
        present: { type: integer }
        total: { type: integer }
        percentage: { type: number }
        status:
          type: string
          enum: [good, average, low]
        lastUpdated: { type: string }
        studentId: { type: ["integer", "null"] }
    AttendanceInput:
      type: object
      required: [subjectId, date, records]
      properties:
        subjectId: { type: integer }
        date: { type: string, format: date }
        records:
          type: array
          items:
            $ref: "#/components/schemas/AttendanceRecordInput"
    AttendanceRecordInput:
      type: object
      required: [studentId, status]
      properties:
        studentId: { type: integer }
        status:
          type: string
          enum: [present, absent, late, duty]
    Mark:
      type: object
      required: [id, subjectId, subject, assessment, score, maxScore, grade, passed]
      properties:
        id: { type: integer }
        subjectId: { type: integer }
        subject: { type: string }
        assessment: { type: string }
        score: { type: number }
        maxScore: { type: number }
        grade: { type: string }
        passed: { type: boolean }
        studentId: { type: ["integer", "null"] }
    MarkInput:
      type: object
      required: [studentId, subjectId, assessment, score, maxScore]
      properties:
        studentId: { type: integer }
        subjectId: { type: integer }
        assessment: { type: string }
        score: { type: number }
        maxScore: { type: number }
    Assignment:
      type: object
      required: [id, title, subject, dueDate, maxMarks, status, submissions]
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        subject: { type: string }
        dueDate: { type: string, format: date }
        maxMarks: { type: number }
        status:
          type: string
          enum: [open, due, closed, submitted]
        submissions: { type: integer }
        submitted: { type: boolean }
    AssignmentInput:
      type: object
      required: [subjectId, title, description, dueDate, maxMarks]
      properties:
        subjectId: { type: integer }
        title: { type: string, minLength: 2 }
        description: { type: string }
        dueDate: { type: string, format: date }
        maxMarks: { type: number }
    Submission:
      type: object
      required: [id, assignmentId, submittedAt, status]
      properties:
        id: { type: integer }
        assignmentId: { type: integer }
        submittedAt: { type: string }
        status:
          type: string
          enum: [submitted, late, evaluated]
        marks: { type: ["number", "null"] }
        feedback: { type: ["string", "null"] }
    SubmissionInput:
      type: object
      properties:
        note: { type: string }
    Announcement:
      type: object
      required: [id, title, content, audience, priority, publishedAt, author]
      properties:
        id: { type: integer }
        title: { type: string }
        content: { type: string }
        audience: { type: string }
        priority:
          type: string
          enum: [normal, important, urgent]
        publishedAt: { type: string }
        author: { type: string }
    AnnouncementInput:
      type: object
      required: [title, content, audience, priority]
      properties:
        title: { type: string, minLength: 2 }
        content: { type: string }
        audience: { type: string }
        priority:
          type: string
          enum: [normal, important, urgent]
    Event:
      type: object
      required: [id, title, description, date, time, venue, organizer, capacity, registered, registeredByMe]
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        date: { type: string, format: date }
        time: { type: string }
        venue: { type: string }
        organizer: { type: string }
        capacity: { type: integer }
        registered: { type: integer }
        registeredByMe: { type: boolean }
    EventInput:
      type: object
      required: [title, description, date, time, venue, organizer, capacity]
      properties:
        title: { type: string, minLength: 2 }
        description: { type: string }
        date: { type: string, format: date }
        time: { type: string }
        venue: { type: string }
        organizer: { type: string }
        capacity: { type: integer }
    EventRegistration:
      type: object
      required: [id, eventId, registeredAt]
      properties:
        id: { type: integer }
        eventId: { type: integer }
        registeredAt: { type: string }
    Complaint:
      type: object
      required: [id, title, category, description, priority, status, createdAt, student]
      properties:
        id: { type: integer }
        title: { type: string }
        category: { type: string }
        description: { type: string }
        priority:
          type: string
          enum: [low, medium, high]
        status:
          type: string
          enum: [submitted, review, progress, resolved, rejected]
        createdAt: { type: string }
        student: { type: string }
        remark: { type: ["string", "null"] }
    ComplaintInput:
      type: object
      required: [title, category, description, priority]
      properties:
        title: { type: string, minLength: 2 }
        category: { type: string }
        description: { type: string }
        priority:
          type: string
          enum: [low, medium, high]
    ComplaintStatusInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [submitted, review, progress, resolved, rejected]
        remark: { type: string }
    Notification:
      type: object
      required: [id, title, message, type, read, createdAt]
      properties:
        id: { type: integer }
        title: { type: string }
        message: { type: string }
        type: { type: string }
        read: { type: boolean }
        createdAt: { type: string }
    ChatInput:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1 }
    ChatResponse:
      type: object
      required: [answer, source]
      properties:
        answer: { type: string }
        source:
          type: string
          enum: [ai, faq, fallback]
        suggestions:
          type: array
          items: { type: string }
    AcademicInsights:
      type: object
      required: [level, score, recommendations, risks]
      properties:
        level: { type: string }
        score: { type: number }
        recommendations:
          type: array
          items: { type: string }
        risks:
          type: array
          items:
